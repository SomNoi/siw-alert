name: siw-alert
on:
  schedule:
    - cron: '*/5 * * * 0-5'   # UTC; Sun evening..Fri (gold trades Sun 22/23 UTC -> Fri 21/22 UTC). GitHub cron may lag 5-20 min.
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: siw-alert, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: tests
        run: python -m unittest discover -s tests
      - name: fetch + compute + notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python engine/run.py
      - name: commit if changed
        run: |
          git config user.name siw-bot; git config user.email siw-bot@users.noreply.github.com
          git add docs/data state
          if git diff --cached --quiet; then echo "no change"; else git commit -qm "data $(date -u +%FT%TZ)" && git pull --rebase -q && git push -q; fi
